[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capat"
version = "0.1.1"
description = "CAPtcha ATtacking tool: measure how well an image CAPTCHA resists automation. For authorized testing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "goblensec" }]
keywords = ["security", "captcha", "ocr", "pentest", "bot-detection", "appsec"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
easyocr = ["easyocr>=1.7"]
ddddocr = ["ddddocr>=1.5"]
all-solvers = ["easyocr>=1.7", "ddddocr>=1.5", "pytesseract>=0.3.10"]
tesseract = ["pytesseract>=0.3.10"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
capat = "capat.cli:main"

[project.urls]
Homepage = "https://github.com/goblensec/capat"
Issues = "https://github.com/goblensec/capat/issues"

[project.entry-points."capat.solvers"]
# third-party recognition engines register here, e.g.:
# trocr = "capat_trocr:TrOCRSolver"

[project.entry-points."capat.modules"]
# third-party checks register here, e.g.:
# audio = "capat_audio:AudioChallenge"

[tool.hatch.build.targets.sdist]
# Listed explicitly rather than left to hatchling's default of "everything not
# gitignored": this tree has no .gitignore, so scratch files sitting in the
# working directory (screenshots, a stray run.json) were being published.
include = [
  "src/capat",
  "tests",
  "docs",
  ".github",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capat"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["easyocr.*", "pytesseract.*", "ddddocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
